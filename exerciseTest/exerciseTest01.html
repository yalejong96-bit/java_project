<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #box {
            position: relative;
            top: 140px;
            border-radius: 5px;
            border: 2px solid lightgray;
            padding: 20px;
            width: 100%;
        }

        #mainImage {
            width: 100%;
            height: 300px;
            max-width: 500px;
            transaction: transform 0.3 ease;
            transform-origin: top left;
        }

        #mainImage:hover {
            transform: scale(1.1);
        }

        .img-box {
            width: 250px;
            height: 160px;
            margin: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .active-thumb {
            border: 2px solid blue;
        }

        #width {
            height: 50px;
        }

        #height {
            height: 50px;
        }

        .btn {
            width: 200px;
            height: 50px;
        }
    </style>
</head>
<body>
<div id="box" class="container mt-3">
    <h5>썸네일 → 큰 이미지 변경 + 크기 조절</h5>
    <img id="mainImage" src="/images/americano01.png" class="img-fluid mb-2">

    <form>
        <div class="d-flex justify-content-center mt-3">
            <input type="text" class="form-control" id="width" placeholder="너비(px)" name="name">

            <input type="text" class="form-control" id="height" placeholder="높이(px)" name="name">

            <button id="changeButton" class="btn btn-primary me-3 px-2">크기 변경</button>
        </div>
    </form>

    <div>
        <img src="/images/americano01.png" class="img-box thumb-image active-thumb">
        <img src="/images/whitewine02.png" class="img-box thumb-image">
        <img src="/images/brioche_02.png" class="img-box thumb-image">
    </div>
</div>
<script>
    $(".thumb-image").click(function () {
        const newSrc = $(this).attr("src");
        console.log(`선택된 이미지 : ${newSrc}`);

        $("#mainImage").attr("src", newSrc);

        $(".active-thumb").removeClass("active-thumb");
        $(this).addClass("active-thumb");
    });
    $("#changeButton").click(function (event) {
        event.preventDefault();

        const width_value = $("#width").val();
        const height_value = $("#height").val();
        const mainImage = $("#mainImage");

        mainImage.removeClass().addClass('img-fluid');
        mainImage.css({
            "width": width_value + "px",
            "height": height_value + "px"
        });
    })
</script>
</body>
</html>
