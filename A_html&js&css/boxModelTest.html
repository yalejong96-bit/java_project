<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        div{
            border:1px solid black;
            width: 100px;
            height: 100px;
            position: absolute;
        }
        #mydiv{
            top:10px;
            left:10px;
            width: 300px;
            height: 300px;
            background: white;
            border: 1px solid red;
            position: relative;
        }
        .test1{/* 소녀 시대 */
            top:20px;
            margin-left:0px;
            background:aqua;
        }
        .test2{/* 원더 걸스 */
            margin-top:50px;
            margin-bottom:30px;
            left:150px;
            background:fuchsia;
        }
        .test3{/* 티아라 */
            top:150px;
            left:30px;
            margin-right:80px;
            background:yellow;
        }
        .test4{/* exid */
            left:120px;
            bottom:20px;
            background:blue;
        }
    </style>
</head>
<body>
<div id="mydiv">
    <div class="test1">소녀 시대</div>
    <div class="test2">원더 걸스</div>
    <div class="test3">티아라</div>
    <div class="test4">exid</div>
</div>

</body>
</html>
